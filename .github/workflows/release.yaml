name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags "-s -w" -o contactkit ./cmd/contactkit
          tar czf contactkit-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz contactkit
      - uses: actions/upload-artifact@v4
        with:
          name: contactkit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: contactkit-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate checksums
        run: |
          cd artifacts
          find . -name '*.tar.gz' | while read f; do mv "$f" .; done
          sha256sum *.tar.gz > checksums.txt
      - name: Read version
        id: version
        run: echo "TAG=v$(cat VERSION)" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
          generate_release_notes: true
